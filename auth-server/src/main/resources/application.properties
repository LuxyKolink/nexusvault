# NexusVault Authentication Server Configuration
server.name=NexusVault Authentication Server
server.version=1.0.0

# Database Configuration
db.url=jdbc:mariadb://localhost:3306/nexusvault_authentication
db.user=root
db.password=root
db.driver=org.mariadb.jdbc.Driver

# RMI Service Configuration
rmi.port=1099
rmi.service.name=AuthService
rmi.bind.address=0.0.0.0

# JWT Configuration
# To generate a new secret, use the command: openssl rand -base64 32
# In Windows, use: $bytes = New-Object Byte[] 32 ; (New-Object Security.Cryptography.RNGCryptoServiceProvider).GetBytes($bytes); [Convert]::ToBase64String($bytes)
jwt.secret=qSBsCdymoTdqnEMhQIQmkrzT3vDCv4pJccv3IOGqi7s=
jwt.expiration=3600
jwt.issuer=NexusVault

# Security Settings
password.min.length=8
password.hash.algorithm=SHA-256
